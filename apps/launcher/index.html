<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reborn Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Inline pre-React styles : on évite le flash blanc avant que Vite + React aient mounté.
         La couleur de fond doit matcher var(--color-background) dans globals.css. -->
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0608;
        color: #e5e7eb;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      #reborn-preload {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background:
          radial-gradient(ellipse 80% 55% at 20% 10%,
            rgba(176, 28, 50, 0.20) 0%,
            rgba(176, 28, 50, 0.06) 42%,
            transparent 75%),
          radial-gradient(ellipse 60% 50% at 100% 100%,
            rgba(224, 176, 106, 0.08) 0%,
            transparent 60%),
          #0a0608;
        transition: opacity 280ms ease-out, visibility 280ms;
      }
      #reborn-preload.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .reborn-preload-title {
        font-family: "Bebas Neue", "Impact", sans-serif;
        font-size: 88px;
        letter-spacing: 0.08em;
        line-height: 0.9;
        margin: 0;
        background: linear-gradient(180deg, #ffffff 0%, #f7ecd6 55%, rgba(224, 176, 106, 0.7) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter:
          drop-shadow(0 0 24px rgba(176, 28, 50, 0.45))
          drop-shadow(0 0 6px rgba(255, 255, 255, 0.12));
        animation: reborn-preload-fade-in 600ms ease-out;
      }
      .reborn-preload-tagline {
        font-family: "Inter", system-ui, sans-serif;
        font-size: 11px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #6b7280;
        margin: 0;
        animation: reborn-preload-fade-in 600ms 200ms ease-out both;
      }
      .reborn-preload-bar {
        width: 220px;
        height: 2px;
        background: rgba(176, 28, 50, 0.15);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        animation: reborn-preload-fade-in 600ms 350ms ease-out both;
      }
      .reborn-preload-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: linear-gradient(90deg,
          transparent,
          #b01c32 30%,
          #f4cd86 50%,
          #b01c32 70%,
          transparent);
        animation: reborn-preload-bar-slide 1.4s ease-in-out infinite;
        box-shadow: 0 0 12px rgba(176, 28, 50, 0.6);
      }
      @keyframes reborn-preload-bar-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @keyframes reborn-preload-fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <!-- Preload splash : visible avant que React mount. main.tsx l'enleve une fois React pret. -->
    <div id="reborn-preload">
      <h1 class="reborn-preload-title">REBORN</h1>
      <p class="reborn-preload-tagline">Roleplay · Initialisation</p>
      <div class="reborn-preload-bar" role="progressbar" aria-label="Chargement"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
