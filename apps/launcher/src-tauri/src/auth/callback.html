<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Reborn — Connexion reussie</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Inter", system-ui, sans-serif;
        background: radial-gradient(ellipse at top, #1c2a55 0%, #07080b 70%);
        color: #e5e7eb;
      }
      .card {
        text-align: center;
        max-width: 380px;
        padding: 32px;
      }
      .check {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: #3b5bdb;
        display: grid;
        place-items: center;
        box-shadow: 0 8px 30px -10px rgba(59, 91, 219, 0.6);
      }
      .check svg {
        width: 28px;
        height: 28px;
        stroke: #fff;
        stroke-width: 3;
        fill: none;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #9ca3af;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="check">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="4 12 10 18 20 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1>Connexion reussie</h1>
      <p>Tu peux fermer cette fenetre et retourner dans le launcher Reborn.</p>
    </div>
    <script>
      setTimeout(function () {
        window.close();
      }, 1500);
    </script>
  </body>
</html>
