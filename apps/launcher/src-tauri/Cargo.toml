[package]
name = "launcher"
version = "0.3.2"
description = "Reborn Roleplay launcher (Tauri 2 backend)"
authors = ["Reborn Roleplay"]
edition = "2021"

[lib]
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Auto-update du launcher : verifie la signature Ed25519 du release,
# telecharge l'installer + restart. Endpoint + pubkey dans tauri.conf.json.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Persistance JSON cote frontend (liste des comptes Microsoft enregistres
# pour le carousel du LoginScreen). AUCUN secret n'y est ecrit — les
# refresh tokens restent dans le keyring OS (storage/secrets.rs).
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime + HTTP client
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Crypto / encoding utilities
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
hex = "0.4"

# Secure local storage for refresh tokens (Windows Credential Manager / macOS Keychain / Secret Service)
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent"] }

# Error handling + logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID parsing for Minecraft profiles (raw to dashed form)
uuid = { version = "1", features = ["v4"] }

# Dev convenience: load .env from the workspace root in debug builds.
dotenvy = "0.15"

# Ed25519 signature verification for the launch manifest (PLAN §4.3).
ed25519-dalek = "2"

# Pinned constant-time helpers (already used transitively by ed25519-dalek
# but kept explicit because we'll lean on them for token comparisons).
subtle = "2"

# Pour limiter la concurrence des telechargements (semaphore).
futures = "0.3"

# SHA-1 (le manifest piston-meta donne des hashs en SHA-1, pas SHA-256).
sha1 = "0.10"

# FS watcher anti-tampering (mods/ + config/) pendant que la JVM tourne.
notify = "7"

# Extraction des libraries natives (Mojang livre les .dll/.so/.dylib en jar).
zip = { version = "2", default-features = false, features = ["deflate"] }

# Discord Rich Presence (IPC vers le client Discord local).
discord-rich-presence = "0.2"

# Detection des specs systeme (RAM/CPU/OS) pour la page Settings → Jeu.
# Disable les features qui ne nous interessent pas (process listing, disks,
# networks, components) pour reduire le binaire — on ne lit que RAM + CPU.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
