<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Reborn · In-Game Menus</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet"/>

<link rel="stylesheet" href="styles.css"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel" src="components/main-menu.jsx"></script>
<script type="text/babel" src="components/esc-menu.jsx"></script>
<script type="text/babel" src="components/settings.jsx"></script>

<script type="text/babel">
/* global React, ReactDOM,
   MainMenuView, EscMenu, SettingsScreen, ConnectingScreen, Panorama */

const SCREENS = [
  { id: "main",         label: "Main Menu" },
  { id: "main-quit",    label: "Main + Modal Quitter" },
  { id: "main-playlist",label: "Main + Playlist OST" },
  { id: "esc",          label: "Menu ESC" },
  { id: "settings",     label: "Paramètres Reborn" },
  { id: "connect",      label: "Connexion en cours" },
];

function Toolbar({ screen, setScreen }) {
  return (
    <div className="toolbar" data-screen-label="Toolbar">
      <span className="toolbar-label">REBORN · MOCKUP</span>
      <div className="toolbar-divider"/>
      <span style={{color: "var(--color-foreground-muted)", fontSize: 11, letterSpacing: ".06em"}}>Écran</span>
      <div className="toolbar-group">
        {SCREENS.map(s => (
          <button
            key={s.id}
            className={`toolbar-btn ${screen === s.id ? "active" : ""}`}
            onClick={() => setScreen(s.id)}>
            {s.label}
          </button>
        ))}
      </div>
      <div style={{marginLeft: "auto", fontSize: 10, color: "var(--color-foreground-muted)", letterSpacing: ".08em"}}>
        1920 × 1080 · sprite-safe pour Fabric / DrawContext
      </div>
    </div>
  );
}

function Stage({ children, label }) {
  const wrap = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const fit = () => {
      if (!wrap.current) return;
      const r = wrap.current.getBoundingClientRect();
      const s = Math.min(r.width / 1920, r.height / 1080);
      setScale(s);
    };
    fit();
    const ro = new ResizeObserver(fit);
    if (wrap.current) ro.observe(wrap.current);
    window.addEventListener("resize", fit);
    return () => { ro.disconnect(); window.removeEventListener("resize", fit); };
  }, []);
  return (
    <div className="stage-wrap" ref={wrap}>
      <div className="stage" data-screen-label={label} style={{transform: `scale(${scale})`}}>
        {children}
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = React.useState("main");

  // helpers
  const goMain     = () => setScreen("main");
  const goEsc      = () => setScreen("esc");
  const goSettings = () => setScreen("settings");
  const goConnect  = () => setScreen("connect");

  // Map screen -> content
  let label = screen;
  let body = null;
  if (screen === "main" || screen === "main-quit" || screen === "main-playlist") {
    const overlay = screen === "main-quit" ? "quit"
                  : screen === "main-playlist" ? "playlist"
                  : null;
    const setOverlay = (o) => {
      if (o === "quit")     setScreen("main-quit");
      else if (o === "playlist") setScreen("main-playlist");
      else                  setScreen("main");
    };
    label = screen === "main" ? "Main Menu"
          : screen === "main-quit" ? "Main Menu — Quit modal"
          : "Main Menu — OST playlist";
    body = (
      <MainMenuView
        overlay={overlay} setOverlay={setOverlay}
        onSettings={goSettings} onConnect={goConnect}/>
    );
  } else if (screen === "esc") {
    label = "ESC Menu";
    body = (
      <>
        {/* simulate game render under the ESC backdrop */}
        <Panorama/>
        <EscMenu onResume={goMain} onSettings={goSettings} onQuit={goMain}/>
      </>
    );
  } else if (screen === "settings") {
    label = "Settings — Paramètres Reborn";
    body = (
      <>
        <Panorama/>
        <div style={{position: "absolute", inset: 0, background: "rgba(7,8,11,.85)"}}/>
        <SettingsScreen onBack={goEsc}/>
      </>
    );
  } else if (screen === "connect") {
    label = "Connecting";
    body = <ConnectingScreen onCancel={goMain}/>;
  }

  return (
    <>
      <Toolbar screen={screen} setScreen={setScreen}/>
      <Stage label={label}>{body}</Stage>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
