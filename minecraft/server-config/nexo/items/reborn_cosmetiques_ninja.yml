# Teinture (18/10) : « color » = couleur du tissu par défaut (celle du bandeau d'origine : rendu identique). Nexo génère
# la définition nexo:bandeau_ninja avec une source de teinte minecraft:dye (défaut = cette couleur) ; seules les faces
# tintindex 0 du modèle (le tissu, peint en gris clair) la prennent, la plaque (groupe « metal ») reste telle quelle.
# Le joueur change la couleur dans la sacoche (clic droit sur le bandeau porté › Teinture…) : ShinobiCore réécrit
# dyed_color. Après un nouvel export Blockbench : relancer mod-hud/tools/teinture_bandeau_nexo.py (affiche la valeur).
bandeau_ninja:
  itemname: <gray>Bandeau de Ninja
  material: PAPER
  color: "#302C32"
  lore:
  - <gray>Cosmétique ninja
  - <blue>Commun
  Pack:
    model: reborn:item/bandeau

