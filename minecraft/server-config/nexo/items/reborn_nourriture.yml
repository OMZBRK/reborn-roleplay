# Reborn — Nourriture (GAMEPLAN §12, docs/gameplay/NOURRITURE.md v3 — 14/10)
#
# Les objets de jeu (panier, plats, ration, bol vide) sont CRÉÉS PAR SHINOBICORE (PAPER + item_model reborn:<id> +
# données en PDC : recette, chaleur, part entamée). Seuls ces objets-là se mangent et se cuisinent.
# Ce fichier n'enregistre les mêmes visuels dans Nexo que pour l'affichage staff (/nexo give, catalogue) : un objet
# donné par /nexo n'a pas les données de ShinobiCore et ne se mange pas. Pour tester : /nourriture donner.
#
# Modèles et textures : pack/assets/reborn/{items,models/item,textures/item}/<id>.* — générés par
# minecraft/mod-hud/tools/gen_nourriture_textures.py (sprites 16×16, item/generated).

