# Reborn — Cloche du village et volières (docs/gameplay/CLOCHE_ET_MISSIVES.md §4 — 16/10)
#
# Visuels PROVISOIRES générés par minecraft/mod-hud/tools/gen_communication_textures.py :
#   pack/assets/reborn/{items,models/item,textures/item}/<id>.*
# L'utilisateur modélise les vrais (Blockbench) en GARDANT CES IDENTIFIANTS.
#
# MEUBLES (posés par le staff) : la cloche de la place et le perchoir d'une volière ne font rien seuls. Le staff vise
# le meuble posé et l'enregistre : /cloche poser <village> [rayon] ["lieu"] ou /voliere poser "<nom>" <type> <village>.
# Ensuite : menu R ou clic droit → écran de la cloche / de la volière (mod Reborn). Hitbox en barrières : ShinobiCore
# reconnaît le clic sur le bloc de barrière (ou sur l'entité d'interaction si tu passes en « interactions »).
#
# MISSIVES : créées par SHINOBICORE (PAPER + item_model reborn:missive_scellee | reborn:missive_descellee + identifiant
# en PDC reborn:missive). Une missive donnée par /nexo est vide (catalogue seulement).

