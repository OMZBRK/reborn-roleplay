# Carte du monde (touche M côté client, canal reborn:map).
#
# maps.<id>   : une carte = une texture du mod (assets/reborn/textures/gui/map/<id>.png)
#               liée à un monde Bukkit.
# places.<id> : type zone (grand libellé) | lieu | pnj | porte (marqueurs losange).
#               y absent = surface au moment de la téléportation.
#
# Les positions ci-dessous sont ESTIMÉES depuis le rendu du build (PaysDuFeu06,
# 2026-10-02). Corrige-les en jeu : place-toi au bon endroit puis
#   /carte set <id> <type> <nom…>      (remplace le lieu existant)
#   /carte del <id>
# La téléportation (« Y aller ») est réservée au staff : shinobicore.map.tp.

