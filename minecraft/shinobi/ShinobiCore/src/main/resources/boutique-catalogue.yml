# ======================================================================
# Catalogue des boutiques-lieux (docs/gameplay/BOUTIQUES.md §4, décisions du 15/10)
# ======================================================================
# Copié dans plugins/ShinobiCore/boutique-catalogue.yml au premier démarrage ; éditable, puis /boutique recharger.
# Les prix et les conditions vivent ICI (serveur), jamais dans le mod.
#
# Une entrée = un article :
#   nom        : libellé affiché
#   categorie  : tenues | hauts | bas | manteaux | coiffes | masques | accessoires
#                (les vivres et les cartes du bazar viennent de la nourriture et de places.yml)
#   genre      : tenue = calque de skin, ajouté à la GARDE-ROBE du personnage (ownedOutfits : liée au personnage,
#                         perdue à sa mort RP, ni échangeable ni volable) ;
#                objet = cosmétique 3D Nexo remis dans la sacoche (échangeable, volable, perdu à la mort RP)
#   nexo       : (objet) identifiant de l'objet Nexo
#   emplacement: (objet) CHAPEAU | BANDEAU | MASQUE | BOUCLE | MANTEAU | HAUT | TENUE | CEINTURE | BAS | DOS
#   prix       : en ryo (payé avec la bourse ; ventes détruites en V1, journal ECONOMIE ACHAT)
#   conditions : liste ; grade>=chunin, fonction=anbu (permission reborn.fonction.anbu), entreprise=<id>
#                → grisé avec la raison ; clan=uchiha, village=konoha, sexe=femme, personnage=#00042 → caché
#
# Répartition du 15/10 : les 59 tenues du mod sont toutes des tenues complètes (calques vérifiés : corps, bras et
# jambes couverts) → catégorie « tenues » ; prix par gamme (200 à 400 au quotidien, 450 à 900 les belles tenues,
# 1 200 à 1 400 la cérémonie, 450 à 800 les tenues de clan). Hauts, bas et manteaux attendent leurs assets.
