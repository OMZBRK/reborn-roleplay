# ------------------------------------------------------------
# ShinobiCore configuration
# All values below are live-reloadable with: /sc reload
# ------------------------------------------------------------

# Mode du serveur.
#   dev   (defaut) = serveur RP complet : toutes les features RP actives.
#   build          = serveur creatif staff : coupe les features RP (character
#                    selector, lockdown sans perso, HUD vitals/chakra, tablist
#                    custom, sacoche, typing...) pour que le builder batisse
#                    tranquille. Le canal reborn:tablist n'etant plus declare,
#                    le mod client eteint aussi toute son UI RP tout seul.
# NB: prend effet a l'activation du plugin (restart / reload complet), PAS a
#     chaud via /sc reload (qui ne re-enregistre pas les listeners).
mode: dev

chakra:
  # Chakra does NOT regenerate passively. Use /meditation to regenerate.
  auto-regen: false
  # Live chakra value shown in the vanilla XP bar as a percentage of max.
  display-as-xp: true
  # Overdraw / exhaustion economy — the balancer for "no hard rank gates".
  # Casting beyond your pool pushes it into DEBT; while in debt a debuff
  # ladder stacks and the character collapses (KO) after a deficit-scaled
  # fuse. Regen / meditation / a medic pays the debt down and clears it.
  overdraw:
    enabled: true
    # Seconds in deficit before KO at a shallow debt.
    ko-seconds: 15
    # Floor on that fuse for the deepest overdraws (debt ~= a full pool).
    min-ko-seconds: 6

# ------------------------------------------------------------
# Stats — six stats allouées (docs/technique/SPEC_STATS_SERVICE.md, option B).
# Tout ce bloc = des LEVIERS : rechargeables à chaud (/sc reload), aucune
# migration. Valeurs = valeurs de départ du prototype, à régler au playtest.
# Structurel (pas ici) : les six stats, MIN = 1, MAX = 10 (ne jamais baisser).
# ------------------------------------------------------------
# ------------------------------------------------------------
# Grades shinobi (docs/gameplay/STATS_ET_PROGRESSION.md). Le passage de grade est RP (décision ou
# examen) ; /grade l'exécute. Chaque grade donne des bonus passifs ; un joueur
# gradé ne donne que les grades permis ci-dessous, dans son village. « staff »
# (ou absent) = réservé au staff (permission shinobicore.grade.staff).
# Grades : ACADEMICIEN, GENIN, GENIN_CONFIRME, CHUNIN, KONIN, TOKUBETSU_JONIN,
#          JONIN, COMMANDANT_JONIN, KAGE
# ------------------------------------------------------------
grades:
  bonus:                      # pv / chakra / endurance en plus, stats = + à chacune des 6 stats
    ACADEMICIEN:      { pv: 0,   chakra: 0,     endurance: 0,  stats: 0 }
    GENIN:            { pv: 40,  chakra: 2000,  endurance: 5,  stats: 0 }
    GENIN_CONFIRME:   { pv: 80,  chakra: 4000,  endurance: 10, stats: 0 }
    CHUNIN:           { pv: 130, chakra: 7000,  endurance: 15, stats: 1 }
    KONIN:            { pv: 180, chakra: 10000, endurance: 20, stats: 1 }
    TOKUBETSU_JONIN:  { pv: 240, chakra: 13000, endurance: 25, stats: 1 }
    JONIN:            { pv: 300, chakra: 17000, endurance: 30, stats: 2 }
    COMMANDANT_JONIN: { pv: 350, chakra: 20000, endurance: 35, stats: 2 }
    KAGE:             { pv: 400, chakra: 25000, endurance: 45, stats: 3 }
  promotion:                  # grade minimum de celui qui donne le grade
    GENIN:            { merite: TOKUBETSU_JONIN }
    GENIN_CONFIRME:   { merite: TOKUBETSU_JONIN }
    CHUNIN:           { examen: TOKUBETSU_JONIN, merite: JONIN }
    KONIN:            { merite: JONIN }
    TOKUBETSU_JONIN:  { merite: COMMANDANT_JONIN }
    JONIN:            { merite: COMMANDANT_JONIN }
    COMMANDANT_JONIN: { merite: KAGE }
    KAGE:             { merite: staff }
  retrogradation: KAGE        # grade minimum pour rétrograder (toujours un grade sous le sien)

# Progression par l'expérience (invisible pour le joueur) : chaque niveau donne 1 point de stats (menu /stats).
progression:
  niveau-max: 40
  xp-base: 400              # XP pour passer du niveau 1 au 2
  xp-par-niveau: 120        # + par niveau (niveau 10 → 11 : 400 + 9 × 120 = 1 480 XP)
  points-par-niveau: 1
  gains:
    presence-rp: 3          # par minute active avec un autre joueur à proximité
    seul: 1                 # par minute active, seul
    rayon-presence: 20
    entrainement: 4         # + par minute où l'on frappe dans un terrain d'entraînement
    entrainement-max-jour: 120
    seance-parchemin: 40    # séance d'apprentissage réussie (× rang : D 1, C 1,5, B 2, A 3, S 5)
    technique-apprise: 100  # technique apprise par parchemin (× rang)

stats:
  points-per-rank: 3          # points de MÉRITE par passage de grade (8 passages) — séparés des points de stats
  # Réinitialisation par le joueur : TOKEN = consomme un jeton de réinitialisation
  # (acheté en boutique, crédité par « /stats jeton give <joueur> <n> »), FREE =
  # gratuit (phase de test), STAFF = réservé au staff. Le staff est toujours gratuit.
  respec: TOKEN
  soft-cap:
    threshold: 6              # plein rendement jusque-là…
    over-factor: 0.5          # …moitié au-delà (eff(10) = 8)
  hp:                         # PV max = base + eff(Vigueur) × per-vigueur
    base: 200
    per-vigueur: 100
  chakra:                     # Chakra max = base + eff(Chakra) × per-point
    base: 4000
    per-point: 12000
  stamina:                    # Endurance max = base + eff(Vig) × a + eff(Taï) × b
    base: 100
    per-vigueur: 8
    per-taijutsu: 4
  regen:                      # régén /10 s = chakra max × (base + per-controle × eff(Ctr))
    base-fraction: 0.01
    per-controle: 0.0015
  cost:
    reduction-per-controle: 0.03   # −3 % de coût par point effectif de Contrôle
    chakra:   { E: 400, D: 800, C: 2000, B: 5000, A: 12000, S: 35000 }  # S = HIDEN
    stamina:  { E: 12,  D: 18,  C: 30,   B: 45,   A: 60,    S: 75 }
  grade-weights:              # dégâts = base × (1 + Σ poids(lettre) × eff(stat))
    S: 0.12
    A: 0.10
    B: 0.07
    C: 0.04
    D: 0.02
  melee:
    per-point: 0.08           # M1 × (1 + 0.08 × eff(Taï ou Ken))
  crit:                       # techniques seulement — à confirmer ou retirer au playtest
    enabled: true
    base: 0.05
    per-controle: 0.005
    multiplier: 1.5
  nature-wheel:               # Katon › Fūton › Raiton › Doton › Suiton › Katon
    enabled: true
    advantage: 1.25
    disadvantage: 0.8
  attribution:                # fenêtre où les coups d'un lanceur sont rattachés
    technique-window-millis: 4000   # à sa technique (MS / MM / ME) — surchargeable
    melee-window-millis: 700        # par technique : attribution-millis dans abilities.yml

# KO / PainRP — lots KO-1 à KO-3 (docs/gameplay/KO_ET_MORT_RP.md).
# Hors des terrains d'entraînement (/zonerp), les PV perdus restent perdus :
# la régénération naturelle est coupée pour les personnages actifs.
ko:
  pv-persistants: true
  # Défaite sur un terrain d'entraînement : on repart à cette fraction des PV
  # (ou du chakra si c'est le chakra qui a lâché). Aucun KO, aucune blessure.
  defaite-pct: 1.0
  # aggression-log.txt : qui a ouvert chaque échange de coups hors terrain.
  journal-agressions:
    enabled: true
    fenetre-minutes: 5
  # À terre (0 PV) : on rampe, on chuchote, /aide. Un coup de plus ou le
  # timer → inconscient. false = KO direct comme avant.
  a-terre: true
  a-terre-secondes: 45
  # Inconscient (cause PV) : durée d'inconscience. À la fin, on RESTE inconscient
  # et /hopital est proposé (pas de rapatriement automatique).
  inconscient-secondes: 300
  # Volonté (relève au QTE) : facultative, réservée aux personnages qui connaissent
  # cette technique (ou à tous si pour-tous: true).
  volonte:
    technique: volonte
    pour-tous: false
  # Plancher : le repos rend des PV jusqu'à cette fraction ; l'hôpital
  # réveille à cette fraction. Au-delà, il faut un médic.
  plancher-pct: 0.30
  chuchotement-blocs: 4
  # Lits d'hôpital (Infirmerie) : meubles Nexo dont l'id contient l'un de ces mots.
  lits-nexo: [lit, bed, futon]
  # Un lit attribué reste occupé tant que son occupant est à côté, au plus ce temps.
  lit-occupe-minutes: 15
  aide-portee: 48
  ata:
    repos-minutes-pleine: 20
    repos-minutes-allegee: 10
    # Le repos n'avance que si le joueur a bougé la caméra / parlé récemment.
    anti-afk-secondes: 120
    # PV rendus par le repos, en fraction des PV max, toutes les 10 s.
    repos-pv-pct-par-10s: 0.01
  # Douleur (Pain RP, 14/10) : sous ce seuil de PV, avant le KO. Démarche ralentie, ni course ni
  # technique, aucun coup ; les autres peuvent le porter sans accord ou l'exécuter (→ inconscient).
  douleur:
    actif: true
    seuil-pct: 0.05               # fraction des PV max
    vitesse: 0.6                  # facteur de la vitesse de marche
    lutte-appuis: 8               # porté en douleur : appuis sur Espace pour se dégager
    lutte-oubli-secondes: 1.5     # la jauge perd un appui toutes les N secondes
    lutte-protection-secondes: 6  # après s'être dégagé, on ne peut pas le reprendre tout de suite
  # Exécution (menu d'interaction) : canalisation de l'exécution « sans animation ».
  execution:
    canalisation-secondes: 3

# Duel consenti n'importe où (/duel, menu d'interaction du mod ; décision du 2026-10-13).
# Comme un terrain d'entraînement à deux : défaite à 0 PV ou 0 chakra = ni KO ni blessure,
# PV et chakra d'avant le duel rendus aux deux, aucune XP de combat, pas de journal d'agression.
duel:
  actif: true
  distance-proposition: 8         # blocs entre les deux pour proposer (×1,5 pour accepter)
  distance-max: 30                # au-delà, le duel s'arrête (avertissement à 80 %)
  duree-max-secondes: 300         # puis match nul
  expiration-secondes: 30         # une proposition sans réponse tombe
  cooldown-secondes: 10           # entre deux propositions d'un même joueur
  cooldown-couple-secondes: 60    # avant de reproposer à la même personne
  compte-a-rebours: 3             # 3-2-1, sans coups entre les deux
  techniques: true                # false = mains nues et armes seulement
  teleport-max-blocs: 16          # une téléportation plus longue arrête le duel (un shunshin court non)
  grace-secondes: 3               # après la fin, les deux ne peuvent plus se toucher
  annonce:
    actif: true                   # « X et Y s'affrontent en duel », en gris, aux joueurs proches
    rayon: 24

# Journal universel (décision du 14/10 : tout est journalisé, quel que soit le grade).
# Fichiers : plugins/ShinobiCore/<dossier>/<categorie>-AAAA-MM-JJ.log ; consultation : Poste de garde, /journal.
journal:
  actif: true
  dossier: logs
  retention-jours: 90             # fichiers plus vieux supprimés (0 = jamais)
  memoire: 20000                  # entrées gardées en mémoire pour le Poste de garde
  disque-max-jours: 31            # période maximale relue sur disque par une recherche
  chat: true                      # messages du tchat (le vocal n'est jamais journalisé)
  coffres: true                   # ouvertures de coffres et conteneurs
  xp: false                       # chaque gain d'XP (bavard : un par joueur et par minute) ; les niveaux, toujours
  commandes:
    tous: true                    # commandes des joueurs aussi (le staff et la console : toujours)
    ignorer: []                   # préfixes jamais journalisés, ex. "/login"
  combat:
    degats: true                  # chaque coup entre joueurs
    seuil-pv: 0.0                 # ignorer les coups plus faibles

# Inventaire (sacoche) — décisions du 2026-10-13 (docs/gameplay/INVENTAIRE_ET_COSMETIQUES.md).
# Toute clé absente garde la valeur par défaut du code (InventaireConfig).
inventaire:
  ramassage:
    distance: 3.0                 # blocs entre les yeux et l'objet visé (touche Ramasser du mod, F)
    cadence-ms: 250               # au plus 4 ramassages par seconde
    poids-max-pourcent: 130       # on peut ramasser au-delà de la limite jusqu'à ce seuil, pas plus
  surcharge:                      # paliers en % du poids max ; vitesse = facteur de la vitesse de marche
    charge:
      de: 100
      vitesse-de: 0.90
      vitesse-a: 0.70
      saut: 1.0
      sprint: false               # plus de sprint dès « Chargé »
    surcharge:
      de: 115
      vitesse-de: 0.70
      vitesse-a: 0.35
      saut: 0.0                   # ni saut, ni dash, ni course aux murs (mobilité ninja coupée)
    immobile:
      de: 130                     # au-delà : immobile (on peut encore lâcher, ranger, parler)
      vitesse: 0.0
      saut: 0.0
  sol:
    disparition-minutes: 10       # un objet au sol disparaît après ce délai
    disparition-ko-minutes: 15    # objet lâché par un joueur KO
    balayage-secondes: 10
    jamais-detruits:
      parchemins: true            # les rouleaux (identifiant unique) ne disparaissent jamais
      ids: []                     # ids Nexo / de modèle jamais détruits (reliques, objets de quête)
  journal:
    fichier: true                 # logs/inventaire-AAAA-MM-JJ.log
    poste-de-garde-des: RARE      # rareté à partir de laquelle l'action va au journal du Poste de garde
  arme:                           # objets acceptés dans l'emplacement Arme (étui)
    ids: [katana, ninjato, tanto, kendo, gunbai, baton_enma, madara_scythe, bo, nodachi, wakizashi]
    vanilla: true                 # épées, haches, trident, masse
  cases-cachees:
    balayage: true                # range chaque seconde ce qui tombe dans les cases 9-35 de Minecraft

# Rareté des objets (COMMUN, PEU_COMMUN, RARE, EPIQUE, LEGENDAIRE) par id Nexo / id de modèle. Ordre de
# résolution : clé reborn:rarete posée sur l'objet → cette table → rang du parchemin (D → S) → rareté vanilla → Commun.
rarete:
  par-id:
    kunai: COMMUN
    kendo: COMMUN
    bandeau_konoha: PEU_COMMUN
    masque_anbu: RARE
    masque_hannya: RARE
    akatsuki_hat: EPIQUE
    baton_enma: EPIQUE
    gunbai: LEGENDAIRE
    madara_scythe: LEGENDAIRE
    sac_sacoche: COMMUN
    sac_bandouliere: PEU_COMMUN
    sac_dos: PEU_COMMUN
    sac_lourd: RARE

# Mort RP (KO-7) : la scène qui suit la mort.
mort-rp:
  scene-min-secondes: 10   # délai avant « Assister à votre réelle fin ? » (yeux qui se ferment, noir)
  corps-minutes: 15        # le corps (mannequin) reste au sol ce temps après son départ (0 = aucun)

# Soins (lot KO-4). Rangs par permission : shinobicore.medic (rang 1),
# shinobicore.medic.expert (rang 2).
medic:
  paume:
    pct-par-seconde: 0.015        # des PV max du patient, avant bonus
    bonus-controle: 0.10          # × eff(Contrôle) du médic
    bonus-rang2: 1.5
    cout-chakra-pct: 0.01         # du chakra max du médic, par seconde
    plafond-rang1: 0.60
    plafond-rang2: 1.0
    ata-secondes: 30              # soin tenu minimum pour lever l'ATA
    portee: 4.0
    tolerance-mouvement: 1.5
  bandage:
    pv-pct: 0.05                  # plafonné au plancher ko.plancher-pct

# Chirurgie des yeux (/yeux, /bandage, canal reborn:yeux).
yeux:
  jeton-secondes: 120             # durée de validité d'une opération ouverte (écran du mod)
  portee: 3.0                     # distance max opérateur ↔ patient / corps (blocs)
  seuil-cecite: 25                # sous cette intégrité, l'œil ne voit plus
  consentement-secondes: 60       # délai pour accepter une greffe (patient conscient)

meditation:
  enabled: true
  # Régén pilotée par les stats : chaque intervalle rend
  # régén/10 s (stat Contrôle + réserve) × intervalle/10 × stats-multiplier.
  use-stats-regen: true
  stats-multiplier: 3.0
  chakra-per-tick: 100.0   # added every tick-interval (si use-stats-regen: false)
  tick-interval-seconds: 5
  # If the player moves more than this many blocks (HORIZONTAL only) from the
  # sit point, meditation is cancelled.
  cancel-move-radius: 0.4
  # Spawns an invisible marker armor stand so the player visually "sits"
  # on top of the block (not inside it).
  use-armor-stand-seat: true

display:
  # Compact visual health bar. 20.0 scale = always exactly 10 hearts rendered,
  # no matter the character's real Max HP. Set to 0 to disable (use real hearts).
  health-scale: 20.0
  # Ambient saturation effect so the hunger bar never drains. Hidden icon /
  # particles. Re-applied every saturation-refresh-seconds seconds.
  auto-saturation: true
  saturation-refresh-seconds: 30
  # Show the right-side scoreboard with live cooldowns for mobility abilities.
  cooldown-hud:
    enabled: true
    title: "&6Tableau Chakraique"
    # Refresh rate in ticks. 5 = 4 times per second; snappy without being costly.
    refresh-ticks: 5

# When a connecting player has no characters at all, they are locked down
# (blindness + paralysis) with a middle-of-screen title in French asking them
# to contact a staff member.
no-character-lockdown:
  enabled: true
  title: "Vous devez contacter un Staff pour creer votre personnage!"
  # How often to re-apply the effects and the title (in ticks). Keep this low
  # so brief potion-effect gaps / title fades never let the player move.
  refresh-ticks: 40

# Cinematic camera tours (/cinematic) + the first-play "bienvenue" intro.
cinematic:
  # Hard view-lock (true): re-teleports the player to the exact viewpoint
  # every tick, pinning position AND camera rotation — a true locked shot.
  # Set false for free-look (body frozen, camera free).
  lock-view: true
  # Ticks to hold the shot BEFORE the title appears (20 ticks = 1 s).
  # Default 80 = a 4 s establishing beat before the place name shows.
  title-delay-ticks: 80
  # Ticks between each chat line appearing (default 40 = 2 s). The first
  # line appears with the title; each subsequent line rolls in this much
  # later. Make sure an anchor's duration fits them all (title delay +
  # 2 × this interval for three lines).
  text-interval-ticks: 40

mobility:
  # Air-tokens gate airborne mobility abilities (primarily Double Jump).
  # With max=1 a player gets at most ONE airborne manoeuvre per ground
  # touch. Tokens refill ONLY after the player has been continuously
  # grounded for `refill-grounded-ms` milliseconds — grazing the floor
  # for a single tick and bouncing back up does NOT refill. This is what
  # prevents double-jump spam flight.
  air-tokens:
    max: 1
    # 100 ms = 0.1 s of continuous ground dwell refills the token. Short
    # enough that landing + immediately jumping again feels responsive,
    # long enough that a single-tick ground-flicker mid-air can't refill.
    refill-grounded-ms: 100

  naruto-run:
    enabled: true
    # Bukkit potion amplifier (0 = Speed I, 1 = Speed II, 2 = Speed III, ...)
    speed-amplifier: 2
    chakra-cost-per-second: 3.0
    min-chakra-to-start: 5.0
    # Thin, subtle trail instead of a cloud burst.
    particles: true
    # Sound played in a loop under the player while naruto-running.
    wind-sound: "ITEM_ELYTRA_FLYING"
    wind-volume: 0.35
    wind-pitch: 1.2
    wind-loop-ticks: 20
    # ------------------------------------------------------------------
    # Boosts that apply ONLY while Naruto-Run is active. DJ/WJ velocity
    # is multiplied by the h-/v-multiplier — kept just slightly above
    # 1.0 so shinobi-mode leaps feel a bit stronger than a plain DJ
    # without becoming a dash (a big multiplier here made DJ-during-
    # naruto-run feel way too powerful, essentially a free mini-rocket).
    # Mid-air steering during the leap itself is configured separately
    # under `mobility.air-control` below — that block's `naruto-run-*`
    # values kick in automatically while shinobi-mode is on, no extra
    # wiring required here.
    # ------------------------------------------------------------------
    boost:
      horizontal-multiplier: 1.2
      vertical-multiplier: 1.2

  # Post-leap / post-dash air-control. Whenever Double-Jump, Wall-Jump, or
  # ShinobiDash fires, the player enters a "leap window" where pointing the
  # camera applies a small per-tick impulse toward their look direction so
  # they can steer the leap mid-air. The window ends when the player lands
  # or after `leap-window-ms` ms — whichever comes first. While Naruto-Run
  # is ON the impulse and horizontal-speed cap scale up so shinobi-mode
  # leaps feel markedly more manoeuvrable than a plain leap.
  air-control:
    leap-window-ms: 2000
    # Baseline (naruto-run OFF): gentle nudging, can't fight momentum.
    base-impulse: 0.03
    base-max-hspeed: 1.2
    # Naruto-Run ON: a bit more steering authority than baseline, but
    # deliberately modest — the leap should still feel like a leap, not
    # free flight. Small bumps over the base values.
    naruto-run-impulse: 0.05
    naruto-run-max-hspeed: 1.4

  double-jump:
    enabled: true
    chakra-cost: 10.0
    air-token-cost: 1
    # ------------------------------------------------------------------
    # Pitch-blended leap. The DJ magnitude curves between three anchors
    # based on where the player is looking:
    #   - Looking *forward* (horizontal): long horizontal dash
    #     (~10-12 blocks forward + ~3 up).
    #   - Looking *up*: tall vertical launch for cliff scaling
    #     (~3 blocks forward + ~12 up).
    #   - Looking *down*: forward dive, minimal lift
    #     (~10 blocks forward + ~1.5 up).
    # Values are raw velocities; in-game arc distance is roughly h*6
    # blocks horizontal and v*6 blocks vertical at these magnitudes.
    # ------------------------------------------------------------------
    horizontal-forward: 1.8
    vertical-forward: 0.75
    horizontal-up: 0.55
    vertical-up: 2.0
    horizontal-down: 1.8
    vertical-down: 0.45
    # If true, the player must re-touch the ground before another double jump
    # is allowed (even if they still have air-tokens). Prevents spam-flying.
    require-ground-touch-between: true
    # Minimum milliseconds since the LAST double jump before lockout can be
    # cleared on ground-touch. Prevents ground-glitch exploits that refill
    # lockout on the same tick the DJ fires.
    lockout-min-air-ms: 400
    # OPT-IN defense-in-depth. If > 0, requires this many milliseconds of
    # CONTINUOUS ground dwell before the DJ lockout can clear. Normally
    # DISABLED (0) because the token-refill dwell (mobility.air-tokens.
    # refill-grounded-ms) already serves as the primary bounce-house gate:
    # a single-tick ground flicker can't refill tokens, so the next DJ
    # fails at the token check regardless of lockout state. Enable this
    # (e.g. 100–200ms) only if you've customised air-token behaviour in a
    # way that would otherwise let bounce-house spam through. Leaving it
    # at 500 makes legitimate "land, jump, DJ at apex" sequences feel
    # unresponsive because the lockout can't clear during short ground
    # touches between jumps.
    lockout-min-ground-dwell-ms: 0
    cooldown-ms: 500
  wall-jump:
    enabled: true
    chakra-cost: 8.0
    # ------------------------------------------------------------------
    # Same pitch-blended curve as double-jump, but horizontal travel is
    # INVERTED relative to the camera — the player is always pushed AWAY
    # from the wall's face, regardless of which way they're looking.
    # So "horizontal-forward" here means "push away from wall when the
    # player is looking horizontally at it". Look up for a mostly-vertical
    # kick off the wall (great for scaling), look down for a low backward
    # hop.
    # ------------------------------------------------------------------
    horizontal-forward: 1.8
    vertical-forward: 0.75
    horizontal-up: 0.55
    vertical-up: 2.0
    horizontal-down: 1.8
    vertical-down: 0.45
    # Wall-jump is intentionally DECOUPLED from the DJ air-token budget.
    # Letting it refill tokens / clear the DJ lockout (below) was found to
    # enable infinite flight: alternating wall-jump ↔ double-jump beside any
    # solid block (tree, pillar, fence) never required actually landing.
    # Leave both of these false unless you genuinely want that combo back.
    refill-tokens-on-use: false
    clears-double-jump-lockout: false
    cooldown-ms: 350

  # FloorShockwave — sneak in the air for 3s to get slammed into the floor in
  # the direction you're looking. On impact: AoE stun + knockback + damage.
  floor-shockwave:
    enabled: true
    chakra-cost: 25.0
    # Seconds of continuous airborne-sneak required before slam triggers.
    charge-seconds: 3.0
    # ------------------------------------------------------------------
    # Pitch-blended slam. "horizontal-*" is forward reach along the look
    # XZ; "down-*" is the downward magnitude applied to Y (always forced
    # negative regardless of pitch — this is a FLOOR attack, so the
    # player is always pulled toward the ground). The watcher task
    # re-applies this velocity every tick so drag can't slow the descent.
    #   - Looking forward: long diagonal slam (10+ blocks horizontal, strong down).
    #   - Looking up:      short horizontal, MAX down pull — still hits floor fast.
    #   - Looking down:    minimal horizontal, MAX down pull — pure drop.
    # ------------------------------------------------------------------
    horizontal-forward: 3.0
    down-forward: 3.5
    horizontal-up: 0.8
    down-up: 4.2
    horizontal-down: 0.4
    down-down: 4.5
    # AoE radius (blocks) on impact.
    radius-blocks: 6.0
    # Damage applied to victims in the AoE (Minecraft HP; 1 heart = 2).
    damage-hp: 5.0
    # Horizontal knockback distance (blocks) applied to victims.
    knockback-blocks: 3.0
    # Stun duration for victims (seconds). Victims are seated + blinded for this long.
    victim-stun-seconds: 0.5
    # Stun duration for the user (seconds). User is slowed/blinded but NOT seated.
    user-stun-seconds: 0.5
    cooldown-ms: 10000

  # ShinobiDash — hold SNEAK while on the ground for 3s+ then release to be
  # propelled along a pitch-blended dash. Primarily a verticality tool for
  # taking high ground; also eats huge horizontal distance when aimed low.
  shinobi-dash:
    enabled: true
    chakra-cost: 20.0
    # Minimum hold time (seconds) before a release will dash.
    min-hold-seconds: 3.0
    # ------------------------------------------------------------------
    # Pitch-blended dash anchors at exactly min-hold-seconds. Holding
    # longer scales ALL magnitudes by (1 + (heldSec - minHold) * bonus),
    # capped at max-multiplier.
    #   - Looking forward: long fast horizontal streak, low lift.
    #   - Looking up:      big vertical kick — the signature verticality
    #                      tool for taking high ground.
    #   - Looking down:    horizontal forward-dive, minimal lift.
    # ------------------------------------------------------------------
    horizontal-forward: 3.0
    vertical-forward: 0.4
    horizontal-up: 0.8
    vertical-up: 3.0
    horizontal-down: 3.0
    vertical-down: 0.2
    # Hold above the minimum multiplies the anchor values.
    bonus-per-extra-second: 0.15
    # Cap on the hold-time multiplier (1.0 = no bonus, 1.5 = +50% at full charge).
    max-multiplier: 1.5
    cooldown-ms: 30000

  # ------------------------------------------------------------------
  # Grappin de Ninja — Pathfinder-style grappling hook fired by LEFT-
  # clicking the item given out via /grappin. Ray-traces a solid block
  # within max-range; on hit, the player is pinned to a fixed-length
  # invisible rope and swings under gravity like a vine. F cancels the
  # grapple mid-swing. The cooldown starts when the grapple ENDS, not
  # when it fires.
  # ------------------------------------------------------------------
  grapple:
    enabled: true
    chakra-cost: 15.0
    # Maximum ray-trace distance in blocks.
    max-range: 60.0
    # Delay in ticks between the hook landing on its target and the pull
    # starting. The rope visually sticks to the anchor during this
    # window, but no forces are applied — a deliberate "latched, about
    # to yank" beat. 0 disables (instant pull); 4 ticks = 200ms is a
    # solid Pathfinder-y pause.
    latch-delay-ticks: 4
    # One-time velocity kick (blocks/tick) ADDED to the player's current
    # velocity when the pull starts (i.e. AFTER the latch delay). Your
    # run speed carries into the swing rather than being replaced — a
    # moving grapple feels like a real leap, not a dead stop + kick.
    initial-boost: 2.0
    # Reel-in force applied per tick toward the anchor. This is what
    # makes the grapple actually DELIVER you to the point — at 0 the
    # rope is a pure vine pendulum and you'll swing under the anchor
    # forever. Raise for faster arrivals, lower for more swing-feel.
    pull-strength: 0.20
    # How much the pull magnitude depends on AIMING at the anchor.
    # 0.0 = pull is constant regardless of look direction (zip-line).
    # 1.0 = pull scales linearly with look·anchor alignment — full when
    #       looking at the anchor, zero when looking 90°+ away.
    # 0.7 = strong "engage the target to be pulled, look away to break
    #       free" feel. This is what lets you grapple the floor, get
    #       yanked down briefly, then look up to coast away with
    #       momentum instead of being stuck at the anchor.
    pull-alignment: 0.7
    # Per-tick velocity drag. 0.99 = 1% loss per tick (~20%/s) — keeps
    # momentum for 360 loops; lower values make the swing feel slushy.
    drag: 0.99
    # When the rope goes taut and the player has drifted past the fixed
    # rope length, pull them back proportionally to the overshoot. Kept
    # gentle so the rope snap doesn't feel like a brick wall — it's the
    # combination of pull-strength pulling you IN and correction
    # nudging you BACK that creates the sense of a physical rope.
    correction-strength: 0.12
    # Safety ceiling on individual velocity magnitude (blocks/tick).
    # Pathfinder-style speed — the player reaches terminal in ~1s of
    # continuous pull.
    max-speed: 3.0
    # Distance (blocks) to the anchor at which the session auto-ends.
    # Pure pendulum has no natural arrival; this gives "you reached it"
    # a definition so the cooldown can arm cleanly.
    reach-distance: 2.0
    # How much the pull vector is biased toward where the camera is
    # aiming, vs. straight at the anchor. This is the "Pathfinder
    # signature" knob — it's what lets you carve around obstacles by
    # looking in the direction you want to curve.
    #   0.0 = pull strictly player→anchor (rigid zip-line).
    #   0.5 = Apex-style half-and-half, the default sweet spot.
    #   1.0 = pull purely in the camera direction (very steerable, loose
    #         — you can fight the anchor's pull by looking away).
    camera-bias: 0.5
    # Auto-detach when the player has swung PAST the anchor plane
    # (anchor-player projected onto the fire direction flips negative).
    # Matches the Apex detach condition from the grapple dissection
    # video; set false if you want the rope to persist through loops.
    detach-on-overshoot: true
    # Tangential air-control — a per-tick nudge along the SPHERE
    # SURFACE (perpendicular to the rope) toward where the player is
    # looking. Because it projects onto the tangent plane it can't
    # fight the pull; it only adds sideways motion, so the player
    # feels like they're sliding around the rope-radius sphere while
    # still being pulled toward the anchor. 0 = off.
    air-control: 0.06
    # Safety ceiling on session length (ticks). 100 ticks = 5 seconds.
    max-ticks: 100
    # Cooldown in milliseconds, armed when the session ends.
    cooldown-ms: 10000

  # ------------------------------------------------------------------
  # Zipline de Ninja — Pathfinder-ultimate-style deployable zipline.
  # Left-click the End Rod item to stretch a zipline from the player's
  # current feet position to the aimed-at block (up to max-range).
  # Two End Rod blocks are placed in the world; a particle line renders
  # between them. Approach either endpoint and press F to ride it. The
  # zipline auto-despawns after lifetime-ticks; the cooldown arms on
  # PLACEMENT (not on ride) — one deploy per cooldown period.
  # ------------------------------------------------------------------
  zipline:
    enabled: true
    chakra-cost: 30.0
    # Maximum deployment distance (blocks). 90 matches the Pathfinder
    # ultimate's reach in Apex.
    max-range: 90.0
    # How close (blocks) the player needs to stand to an endpoint to
    # trigger ride activation on F.
    activation-radius: 3.0
    # Fixed travel speed while riding (blocks/tick). 1.5 bpt = 30 bps —
    # a 90-block zipline rides in about 3 seconds.
    travel-speed: 1.5
    # Safety ceiling on an individual ride's length (ticks). 200 ticks =
    # 10 seconds — should never be hit for a well-formed zipline.
    max-travel-ticks: 200
    # How long (ticks) a placed zipline stays in the world before
    # auto-despawning. 1200 ticks = 60 seconds.
    lifetime-ticks: 1200
    # Cooldown in milliseconds, armed when the zipline is PLACED.
    cooldown-ms: 30000

  # ------------------------------------------------------------------
  # Climb — airborne wall-cling. Sneak-in-air next to a wall to freeze
  # in place (overrides Floor Shockwave's sneak-in-air trigger when a
  # wall is adjacent); release sneak for an upward leap. No cooldown;
  # paced by a two-charge economy that refills after sustained ground
  # contact.
  # ------------------------------------------------------------------
  climb:
    enabled: true
    # Max cling-and-leap charges the player can store.
    max-charges: 2
    # CUMULATIVE seconds of ground contact required to refill ALL
    # charges back to max. Airborne ticks pause the accumulator;
    # landing again continues from where it left off — 3 s grounded +
    # 1 s airborne + 2 s grounded = 5 s total, refill triggers.
    recovery-seconds: 5.0
    # Y-velocity applied on sneak-release. 0.75 gives roughly 3 blocks
    # of rise; vanilla jump-velocity is 0.42 (1.25 blocks).
    leap-velocity: 0.75

  # NOTE: trail system settings live in a separate file —
  # plugins/ShinobiCore/trail-config.yml. Trail data (anchors,
  # names, owners) lives in plugins/ShinobiCore/trails.yml.

# ------------------------------------------------------------
# Lore calendar — in-universe date. Independent of real-world time.
# Months are 1-indexed (1..months-per-year). Days are 1-indexed
# (1..days-per-month). If `auto-advance` is true, the calendar ticks
# one lore-day every `real-minutes-per-day` real minutes and persists
# the new date back into this file.
# ------------------------------------------------------------
lore:
  calendar:
    year: 495
    month: 6
    day: 25
    months-per-year: 12
    days-per-month: 30
    auto-advance: false
    real-minutes-per-day: 120

# ------------------------------------------------------------
# Custom tab list.
# ------------------------------------------------------------
# Character persistence
# ------------------------------------------------------------
# Periodic snapshot of every online player's active character (HP,
# chakra, position, inventory) so a server crash doesn't roll sessions
# back to the last voluntary disconnect. Set to 0 to disable.
character:
  auto-save-seconds: 60

# ------------------------------------------------------------
# Tab list
# ------------------------------------------------------------
# Replaces the vanilla "players online" roster with a lore-flavoured
# header (lore date + country + city) and footer (friend list + active
# character summary + connected-player count).
#
# Each world can set its own country/city; unmapped worlds fall back
# to the `default:` block. Keys under `worlds:` are world names as
# reported by the server (case-insensitive).
# ------------------------------------------------------------
tablist:
  enabled: true
  # Header/footer refresh interval in ticks. 40 = twice a second.
  refresh-ticks: 40
  default:
    country: "Pays du Feu"
    city:    "Konoha"
  worlds:
    world:
      country: "Pays du Feu"
      city:    "Konoha"
    world_nether:
      country: "Pays du Feu"
      city:    "Konoha"
    world_the_end:
      country: "Pays du Feu"
      city:    "Konoha"

# ============================================================
#  Optimization — disable vanilla features the RP server doesn't
#  use, free the tick budget for jutsu / mobility / KO systems.
#
#  Applied on startup and re-applied on /sc reload. Settings
#  marked GAMERULE are written to every loaded world's gamerules;
#  EVENT settings install Bukkit listeners that cancel the
#  unwanted vanilla event.
# ============================================================
optimization:
  enabled: true

  # GAMERULES — written to every world on startup + reload.
  # Set a value to ~ (null) to leave the gamerule untouched.
  gamerules:
    do-daylight-cycle:    false   # fixed time of day (see fixed-time)
    do-weather-cycle:     false   # no random rain / thunder
    do-fire-tick:         false   # fire never spreads
    do-insomnia:          false   # no phantoms
    do-patrol-spawning:   false   # no illager raid patrols
    do-trader-spawning:   false   # no wandering traders
    do-mob-spawning:      false   # disables ALL natural mob spawns
    random-tick-speed:    1       # default 3 — slower crop / leaf / ice ticks
    do-mob-griefing:      true    # leave true unless you want to block creeper holes
    keep-inventory:       true    # required by the KO / Fouiller pipeline

  # World-of-day to pin every world to when do-daylight-cycle is false.
  # Ticks: 0 = dawn, 6000 = noon, 12000 = dusk, 18000 = midnight.
  fixed-time: 6000

  # EVENTS — listener-level kill switches.
  events:
    # Cancel every CreatureSpawnEvent of natural origin (NATURAL,
    # JOCKEY, CHUNK_GEN, REINFORCEMENTS, RAID, PATROL, VILLAGE_INVASION,
    # LIGHTNING). Player-driven spawns (SPAWNER_EGG, BREEDING, CUSTOM,
    # COMMAND, DISPENSE_EGG) and the dummy NPC system stay through.
    block-natural-mob-spawns: true
    # Cancel WeatherChangeEvent that turns rain ON. Rain that's already
    # falling when this loads is cleared on the next world tick.
    block-weather-changes: true

  # PER-WORLD overrides for view + simulation distance. View cuts the
  # number of chunks the client renders; simulation cuts the number of
  # chunks the server ticks (entities / redstone / random-tick). Set
  # either to ~ to leave server.properties value alone.
  view-distance:        8     # default 10
  simulation-distance:  6     # default 10

# ----------------------------------------------------------------------
# SÉLECTION DE PERSONNAGE (pilotée par le mod client mod-hud)
# ----------------------------------------------------------------------
# À la connexion, si le joueur a des personnages mais aucun actif, on le
# téléporte ici, on le fige (visible = son corps sert de perso vu en 3e
# personne côté client) et le mod affiche l'overlay Reborn. Désactivé par
# défaut : tant que enabled=false ou monde absent, on retombe sur l'ancienne
# GUI coffre. Renseigne les coordonnées de ton build de sélection puis passe
# enabled à true.
character-select:
  # Sélection de personnage forcée à la connexion (aucun perso actif = écran de
  # sélection, seul « prendre un perso » débloque le jeu). Activé par défaut : la
  # jouabilité est strictement conditionnée à un personnage actif.
  enabled: true
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# Boutique de tenues (skins) — canal reborn:shop + écran client mod-hud.
shop:
  # Prix plat (en ryo) d'une tenue dans la boutique. La monnaie ryo se donne via /ryo.
  tenue-price: 500

# ----------------------------------------------------------------------
# INTÉGRATION API REBORN (candidature whitelist → grisage du wizard)
# ----------------------------------------------------------------------
# ShinobiCore interroge l'API Reborn (GET /game/candidature/<mcUuid>, signé
# HMAC-SHA256 sur le mcUuid) pour récupérer le village + le clan VALIDÉS de la
# candidature whitelist, et les verrouiller dans le wizard de création (le staff
# reste libre). Dégradation propre : si l'API est injoignable ou le secret
# absent, rien n'est verrouillé.
#   - api-url        : base de l'API (préfixe /v1 inclus).
#   - webhook-secret : MÊME valeur que REBORN_WEBHOOK_SECRET côté API. Laisse
#                      vide pour lire la variable d'environnement REBORN_WEBHOOK_SECRET.
reborn:
  api-url: "http://localhost:3000/v1"
  webhook-secret: ""

# ----------------------------------------------------------------------
# PANEL COMMAND BRIDGE (déclenchement de reloads console depuis le panel)
# ----------------------------------------------------------------------
# Poller SORTANT : le serveur de jeu appelle l'API du panel (aucun port
# entrant, pas de RCON). Toutes les `poll-seconds` :
#   1. GET  <api-url>/files/commands/pending  (X-Reborn-Signature =
#      hex(HMAC-SHA256(secret, "pending")))
#   2. Pour chaque commande, re-vérifie le préfixe contre une whitelist
#      côté plugin (nexo reload / ms reload / mm reload / meg reload) puis
#      la dispatch sur le MAIN THREAD en tant que console.
#   3. POST <api-url>/files/commands/ack  (signature HMAC sur les octets
#      EXACTS du corps envoyé).
# Dégradation propre : si enabled=false, ou aucun secret résolvable, ou API
# injoignable → rien n'est dispatché (log discret, retry au tick suivant).
#   - hmac-secret : MÊME valeur que REBORN_WEBHOOK_SECRET côté panel. Laisse
#                   vide pour lire l'environnement REBORN_WEBHOOK_SECRET.
panel-bridge:
  enabled: false
  api-url: "https://api.reborn-rp.com/v1"
  hmac-secret: ""       # = REBORN_WEBHOOK_SECRET du panel ; vide => lit System.getenv("REBORN_WEBHOOK_SECRET")
  poll-seconds: 5

# ----------------------------------------------------------------------
# MODIFICATEURS (docs/technique/ETATS_JOUEUR.md §4.4) — effets datés posés
# sur un personnage (plats, pilules, staff…). Un type = nom, famille,
# bonus (or) ou malus (vermillon), icône (fichier
# textures/gui/effets/<icone>.png du mod), empilement
# (REMPLACE_SI_PLUS_FORT | PROLONGE | CUMULE + plafond | IGNORE),
# persistance à la déconnexion (GELE | CONTINUE | PERDU), au-ko
# (PERDU | GARDE ; défaut : les bonus partent, les malus restent),
# visible (SOI | STAFF | AUCUN), journal, durée par défaut, texte court
# (valeur : {x} = intensité, {p} = intensité × 100), effets (multiplicateurs
# nommés : "x", "1+x", "1-x" ou un nombre), refuse (capacités retirées :
# SPRINTER, COURSE_NINJA), ensuite (type posé à la fin naturelle).
# ----------------------------------------------------------------------
modificateurs:
  sync-secondes: 10
  types:
    regeneration:
      nom: "Régénération"
      famille: CORPS
      bonus: true
      icone: regeneration
      duree-secondes: 300
      valeur: "×{x}"
      effets:
        regen: "x"
    satiete_prolongee:
      nom: "Satiété prolongée"
      famille: CORPS
      bonus: true
      icone: satiete_prolongee
      duree-secondes: 900
      valeur: "−{p} %"
      effets:
        satiete_perte: "1-x"
    endurance:
      nom: "Endurance"
      famille: CORPS
      bonus: true
      icone: endurance
      duree-secondes: 300
      valeur: "+{p} %"
      effets:
        endurance_regen: "1+x"
    meditation:
      nom: "Méditation"
      famille: ESPRIT
      bonus: true
      icone: meditation
      duree-secondes: 600
      valeur: "×{x}"
      effets:
        meditation: "x"
    pilule_soldat:
      nom: "Pilule du soldat"
      famille: CHAKRA
      bonus: true
      icone: pilule
      duree-secondes: 180
      valeur: "+{p} %"
      effets:
        endurance_regen: "1+x"
      ensuite: fatigue
    fatigue:
      nom: "Fatigue"
      famille: CORPS
      bonus: false
      icone: fatigue
      au-ko: GARDE
      duree-secondes: 300
      valeur: "pas de sprint"
      effets:
        endurance_regen: 0.5
      refuse: [SPRINTER, COURSE_NINJA]
    poison:
      nom: "Poison"
      famille: CORPS
      bonus: false
      icone: poison
      au-ko: GARDE
      duree-secondes: 120
      valeur: "pas de régénération"
      effets:
        regen: 0
    pilule_recharge:
      nom: "Pilule du soldat (délai)"
      famille: CHAKRA
      bonus: false
      icone: pilule
      persistance: CONTINUE
      au-ko: GARDE
      visible: AUCUN
      duree-secondes: 600

# ----------------------------------------------------------------------
# NOURRITURE (docs/gameplay/NOURRITURE.md v3, validée le 14/10) — satiété,
# régénération passive, cuisinier (membre d'une entreprise RESTAURANT,
# /entreprise), repas, tendre, ration sèche, pilule du soldat.
# ----------------------------------------------------------------------
nourriture:
  actif: true
  satiete:
    depart: 80                    # % d'un personnage jamais vu
    perte-par-seconde: 0.0125     # ≈ 1 h 30 de rassasié à affamé : ~2 repas par soirée
    activite:
      assis: 0.5
      marche: 1.0
      trot: 1.5
      sprint: 4.0
      nage: 2.0
      combat: 3.0
    technique-par-10-chakra: 0.2  # % de satiété par 10 chakra dépensés
    vitesse-sprint: 5.8           # blocs/s au-delà desquels on compte un sprint
    combat-secondes: 10           # « en combat » après un coup donné ou reçu
    afk-secondes: 300             # satiété figée au-delà (regard immobile)
    affame: 20                    # sous ce seuil : « Affamé » (icône ambre)
  regeneration:
    seuil: 90
    pv-pourcent-par-seconde: 0.25
    pause-apres-coup-secondes: 30
    plafond-ata: 30
  faim:
    endurance-recuperation: 0.5   # à 0 % : récupération d'endurance ×0,5, plus de sprint, jamais de dégâts
  cuisine:
    preparation-secondes: 15
    plats-par-panier: 2
    distance-max: 4
    plat-chaud-minutes: 10
    poste-de-son-entreprise: true # un cuisinier n'utilise que les fourneaux de SON restaurant
  repas:
    assis-multiplicateur: 2
    pause-apres-coup-secondes: 30
    effets-froid: 0.5             # plat froid : effets réduits de moitié (la satiété reste)
  tendre:
    distance: 3
    delai-secondes: 10
  pilule:
    satiete: 20
    endurance: 0.4
    duree-secondes: 180
    recharge-minutes: 10
    refus-apres-coup-secondes: 30
  ration:
    nom: "Ration sèche"
    satiete: 25
    duree-secondes: 20
    icone: ration
    plafond: 60
  plats:
    ramen_shoyu:
      nom: "Ramen shōyu"
      satiete: 60
      duree-secondes: 45
      icone: ramen
      reste: bol_vide
      effets:
        - {type: regeneration, intensite: 2, duree-secondes: 300}
    ramen_miso:
      nom: "Ramen miso"
      satiete: 65
      duree-secondes: 45
      icone: ramen
      reste: bol_vide
      effets:
        - {type: satiete_prolongee, intensite: 0.25, duree-secondes: 900}
    dango:
      nom: "Dango"
      satiete: 20
      duree-secondes: 30
      icone: dango
      effets:
        - {type: endurance, intensite: 0.2, duree-secondes: 300}
    the_vert:
      nom: "Thé vert"
      satiete: 5
      duree-secondes: 20
      icone: the
      effets:
        - {type: meditation, intensite: 1.25, duree-secondes: 600}
    bento:
      nom: "Bento"
      satiete: 70
      duree-secondes: 60
      icone: bento
      effets:
        - {type: satiete_prolongee, intensite: 0.5, duree-secondes: 1200}
  # Échoppe, onglet « Vivres » : la ration pour tous ; les paniers (recette) pour les cuisiniers seulement.
  vivres:
    ration_seche:
      nom: "Ration sèche"
      prix: 30
      quantite: 2
      cuisinier-seulement: false
    panier_ramen_shoyu:
      recette: ramen_shoyu
      prix: 30
    panier_ramen_miso:
      recette: ramen_miso
      prix: 30
    panier_dango:
      recette: dango
      prix: 20
    panier_the_vert:
      recette: the_vert
      prix: 10
    panier_bento:
      recette: bento
      prix: 40

# Monnaie et banque (GAMEPLAN §19-20, docs/gameplay/MONNAIE_ET_BANQUE.md, décisions du 15/10).
# Tous les défauts sont dans le code (MonnaieConfig) : ces sections sont facultatives et ne surchargent que ce
# qu'elles contiennent (un serveur dont le config.yml ne les a pas tourne avec les mêmes valeurs).
monnaie:
  etats:                          # icône de la bourse : plate < garnie ≤ … < lourde
    garnie: 100
    lourde: 5000
  sol-minutes: 30                 # une bourse posée reste au sol 30 min, puis elle est perdue (journal PERTE)
  alerte-ramasse: 5000            # bourse ≥ ce montant ramassée par un autre → alerte economie
  vol:
    pourcent: 30                  # décision 3 : au plus 30 % de la bourse par scène (tous voleurs confondus)
    sans-plafond-mort-rp: true    # à la mort RP, la bourse se prend entière (le reste est perdu)
    fouille-secondes: 3           # immobile avant d'ouvrir la sacoche du corps
    alerte: 1000                  # vol ≥ ce montant → alerte vol au Poste de garde
    corps-minutes: 15
banque:
  guichet:
    portee: 5.0                   # distance au guichet pour rester sur l'écran
    portee-guichetier: 6.0        # un membre d'une entreprise BANQUE à cette distance = guichetier en service
