# ─────────────────────────────────────────────────────────────────────────────
#  Emotes RP — catalogue serveur (ShinobiCore)
#
#  /playemote <nom> [joueur]   joue une emote (visible par tous les joueurs proches)
#  /stopemote                  arrête l'emote en cours
#
#  Les animations elles-mêmes viennent d'EmoteCraft côté client (built-in + dossier
#  emotes/ du client + emotes distribuées par le serveur). Ce fichier ne fait que
#  DÉCLARER des raccourcis (alias, nom affiché, permission). Le champ « emote » doit
#  correspondre au NOM d'une emote chargée par EmoteCraft (visible dans le menu
#  Reborn : touche « . » → onglet ANIMATIONS, ou la roue EmoteCraft).
#
#  Édite ce fichier depuis le panel staff, puis « /playemote reload ».
# ─────────────────────────────────────────────────────────────────────────────

# open-mode: true  → toute emote chargée côté client est jouable par son nom, même
#                    si elle n'est pas déclarée ci-dessous (idéal pour tester).
# open-mode: false → seules les emotes listées dans « emotes: » sont autorisées.
open-mode: true

# Portée de diffusion en blocs : les joueurs plus loin ne voient pas l'emote.
range: 48.0

emotes:
  wave:
    display: "Saluer"
    emote: "wave"
    aliases: [saluer, salut, hello, hi]
    permission: ""
  bow:
    display: "S'incliner"
    emote: "bow"
    aliases: [incliner, salue, courbette]
    permission: ""
  clap:
    display: "Applaudir"
    emote: "clap"
    aliases: [applaudir, bravo]
    permission: ""
  sit:
    display: "S'asseoir"
    emote: "sit"
    aliases: [asseoir, assis]
    permission: ""
