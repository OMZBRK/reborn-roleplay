name: ShinobiCore
version: ${project.version}
main: com.reborn.shinobicore.ShinobiCore
api-version: '1.21'
authors: [Reborn]
description: Core plugin for a Naruto Roleplay server. Includes ShinobiMobility and ShinobiCharacter modules.
softdepend: [PlaceholderAPI]
commands:
  shinobi:
    description: Commande racine de ShinobiCore.
    usage: /<command> help
    aliases: [sc, shinobicore]
    permission: shinobicore.use
  character:
    description: Gère les personnages shinobi.
    usage: /<command> help
    aliases: [char, characters]
    permission: shinobicore.use
  meditation:
    description: S'asseoir et régénérer du chakra.
    usage: /<command>
    aliases: [meditate, med]
    permission: shinobicore.use
  testfeuille:
    description: Test de la feuille — révèle ta nature de chakra (pondérée par le clan).
    usage: /<command>
    aliases: [feuille, leaftest]
    permission: shinobicore.use
  me:
    description: Narre une action RP avec le surnom de ton personnage.
    usage: /<command> <action>
    aliases: [action, act]
    permission: shinobicore.use
  rencontrer:
    description: Rencontre un autre personnage — donne ton nom ou demande le sien.
    usage: /<command>
    aliases: [meet, introduce]
    permission: shinobicore.use
  amitier:
    description: Envoie une demande d'amitié à la personne que tu regardes.
    usage: /<command>
    aliases: [friend, amis]
    permission: shinobicore.use
  etat:
    description: Affiche l'état ressenti de ton propre personnage.
    usage: /<command>
    aliases: ["état", "état_perso"]
    permission: shinobicore.use
  osculter:
    description: Ausculte la personne en face de toi pour voir son état.
    usage: /<command>
    aliases: [auscult, ausculter, examine]
    permission: shinobicore.osculter
  xp:
    description: Niveau et expérience d'un personnage (staff uniquement).
    permission: shinobicore.staff
    usage: "/<command> [voir|donner|retirer|niveau] …"
  corps:
    description: "Actions sur un corps à terre ou une personne en douleur (menu d'interaction du mod)."
    usage: "/<command> porter|gorge|fouiller|rpk|achever|executer <joueur> [exécution] · annuler · quitter"
  execution:
    description: "Exécutions possédées (staff : donner, retirer, liste, recharger, forcer, douleur, annuler)."
    usage: "/<command> [donner|retirer <joueur> <id>|liste [joueur]|recharger|forcer|douleur|annuler <joueur>]"
  sckillvote:
    description: Vote interne pour valider/refuser une demande Tuer.
    usage: /<command> approve|refuse|goto <id>
    permission: shinobicore.staff
  dummy:
    description: Gère les NPC d'entraînement (cibles paramétrables).
    usage: /<command> create|edit|heal|delete|list|tp <nom>
    aliases: [trainingdummy, sandbag]
    permission: shinobicore.dummy
  soigner:
    description: Soigne la personne en face de toi (silhouette + recette).
    usage: /<command>
    aliases: [heal, treat]
    permission: shinobicore.use
  cinematic:
    description: Crée et gère les cinématiques (outil GM).
    usage: /<command> create|edit|list|delete|play|stop <nom>
    aliases: [cine, cinematique]
    permission: shinobicore.cinematic
  vanish:
    description: Devenir invisible (outil staff) — ouvre un menu de configuration.
    usage: /<command> [personnage]
    aliases: [v, invisible]
    permission: shinobicore.vanish
  assoir:
    description: S'asseoir sur place (relancer pour se relever).
    usage: /<command>
    aliases: [asseoir, sit]
    permission: shinobicore.use
  allonger:
    description: S'allonger / se coucher (relancer pour se relever).
    usage: /<command>
    aliases: [coucher, lay]
    permission: shinobicore.use
  ramper:
    description: Ramper à plat ventre (relancer pour se relever).
    usage: /<command>
    aliases: [crawl]
    permission: shinobicore.use
  stats:
    description: Fiche shinobi — six stats, points à répartir, techniques (SPEC_STATS_SERVICE).
    usage: "/<command> [alloc nin=2,ctr=1|respec|jeton|caractere|citation|voir|give|set|reset|edit|service|json]"
    aliases: [fiche, statistiques]
    permission: shinobicore.use
  sacoche:
    description: Ouvre la sacoche RP (inventaire custom lié au personnage actif).
    usage: /<command> [open|give <id> [n]|reset]
    aliases: [sac, inventaire, inv]
    permission: shinobicore.use
  staff:
    description: Ouvre le panneau staff in-game (spawn menu, items, outils).
    usage: /<command> [build]
    aliases: [panel, staffpanel, adminpanel]
    permission: shinobicore.staff
  playemote:
    description: Joue une emote RP (EmoteCraft), visible par les joueurs proches.
    usage: /<command> <nom> [joueur]
    aliases: [emote, pe]
    permission: shinobicore.emote
  stopemote:
    description: Arrête l'emote RP en cours.
    usage: /<command> [joueur]
    aliases: [stopemotes, se]
    permission: shinobicore.emote
  creator:
    description: Recharge les assets du character creator (creator-assets/) et les repousse.
    usage: /<command> reload
    permission: shinobicore.creator.admin
  ryo:
    description: Boutique — affiche le solde ryo, ou (staff) give/take/set la monnaie d'un joueur.
    usage: /ryo [give|take|set] <joueur> <montant>
  carte:
    description: Carte du monde (touche M) — lieux, et pour le staff téléportation + édition.
    usage: /<command> [liste|tp <id>|set <id> <type> <nom>|del <id>|reload]
    aliases: [map, worldmap]
    permission: shinobicore.use
  meteo:
    description: Météo visuelle (mod client) — pluie, tempête de sable, brume.
    usage: /<command> <pluie|sable|brume|clair> [intensité 0-100 | leger | moyen | fort | tempete] [joueur|tous]
    aliases: [weatherfx]
    permission: shinobicore.meteo
  zonerp:
    description: Zones RP — terrains d'entraînement (sans séquelles) et zones de repos (outil staff).
    usage: /<command> <pos1|pos2|creer <entrainement|repos> <id>|suppr <id>|liste|ici>
    aliases: [entrainement, zonesrp]
    permission: shinobicore.zonerp
  hopital:
    description: Inconscient — se laisser emmener à l'hôpital. Staff — placer les lits (set/suppr/liste).
    usage: /<command> [set <village|defaut>|suppr <village>|liste]
    aliases: [hospital]
    permission: shinobicore.use
  aide:
    description: À terre ou inconscient — appeler à l'aide.
    usage: /<command>
    aliases: [help-rp]
    permission: shinobicore.use
  duel:
    description: "Duel consenti n'importe où — proposer, accepter, refuser, abandonner (sans séquelles)."
    usage: "/<command> <proposer <joueur>|accepter [joueur]|refuser [joueur]|abandonner>"
    aliases: [defi]
    permission: shinobicore.use
  pid:
    description: "Staff — Player ID : N°, nom RP, compte, état d'un personnage (accepte #00042, même hors ligne)."
    usage: "/<command> <joueur|nom RP|#N°>"
    aliases: [playerid, numero]
    permission: reborn.staff.helper
  garde:
    description: Staff — ouvrir le Poste de garde (panel staff en jeu, mod Reborn requis).
    usage: /<command>
    aliases: [postedegarde, panelstaff]
    permission: shinobicore.use
  infirmerie:
    description: Staff — Infirmerie, gestion visuelle du KO (blessés, zones, hôpitaux et lits, réglages).
    usage: /<command>
    aliases: [ko, kogestion]
    permission: shinobicore.use
  staffchat:
    description: "Staff — écrire dans le canal staff (aussi #message dans le chat)."
    usage: /<command> <message>
    aliases: [schat]
    permission: shinobicore.use
  signaler:
    description: Signaler un joueur au staff.
    usage: /<command> <joueur> <motif>
    aliases: [report]
    permission: shinobicore.use
  paume:
    description: Médic — paume de soin maintenue sur le joueur visé. Patient — accepter les soins.
    usage: /<command> [joueur|stop|accepter]
    aliases: [shosen, soin]
    permission: shinobicore.use
  grade:
    description: Grade shinobi — voir son grade, ou promouvoir / rétrograder selon son propre grade (staff sans limite).
    usage: /<command> [voir <joueur>|<joueur> <grade> [merite|examen]]
    permission: shinobicore.use
  ata:
    description: État ATA (blessé, en attente de soin). Staff — voir / lever / appliquer.
    usage: /<command> [voir|lever|appliquer <joueur> [pleine|allegee]]
    permission: shinobicore.use
  yeux:
    description: "Chirurgie des yeux : état des yeux, prélever (corps, mort, KO avec RPK), greffer (médic expert), consentir."
    usage: "/<command> etat [joueur] | prelever <joueur|corps:id> <gauche|droit> | greffer <joueur> <gauche|droit> | consentir <médic>"
    permission: shinobicore.use
  bandage:
    description: "Médic : poser ou retirer un bandage sur les yeux d'un patient."
    usage: "/<command> <joueur> [retirer]"
    permission: shinobicore.use
  journal:
    description: "Staff — journal universel : filtres #N°, catégorie, j:<joueur>, h:<heures>, d:<jours>, p:<page>, texte."
    usage: "/<command> [#N°] [catégorie…] [j:<pseudo|nom RP>] [h:<heures>|d:<jours>] [p:<page>] [texte]"
    aliases: [logs]
    permission: reborn.staff.helper
  note:
    description: "Staff — notes staff sur un personnage (rattachées au N°)."
    usage: "/<command> <cible|#N°> [ajouter [etiquette:<mot>] <texte> | suppr <id>]"
    aliases: [notes, tag]
    permission: reborn.staff.helper
  annonce:
    description: "Staff (Modérateur) — annonce à tous en haut de l'écran ; « joueur » pour une seule personne."
    usage: "/<command> <message> | /<command> joueur <cible> <message>"
    aliases: [broadcast, bc]
    permission: reborn.staff.helper
  annoncejoueur:
    description: "Staff — message affiché à un seul joueur (scène, convocation)."
    usage: "/<command> <cible> <message>"
    aliases: [broadcastplayer, bcp]
    permission: reborn.staff.helper
  aller:
    description: "Staff — se téléporter à un joueur (pseudo, nom RP ou #N°)."
    usage: "/<command> <cible>"
    aliases: [goto, stp]
    permission: reborn.staff.helper
  ramener:
    description: "Staff (Modérateur) — ramener un joueur à soi."
    usage: "/<command> <cible>"
    aliases: [bring]
    permission: reborn.staff.helper
  retour:
    description: "Staff — revenir où l'on était avant /aller ; avec une cible (Modérateur) : la renvoyer où elle était avant /ramener."
    usage: "/<command> [cible]"
    aliases: [back]
    permission: reborn.staff.helper
  geler:
    description: "Staff (Modérateur) — gel persistant (survit à la déconnexion et au redémarrage)."
    usage: "/<command> <cible> [motif]"
    aliases: [freeze]
    permission: reborn.staff.helper
  degeler:
    description: "Staff (Modérateur) — lever un gel (hors ligne possible avec #N°)."
    usage: "/<command> <cible>"
    aliases: [unfreeze]
    permission: reborn.staff.helper
  voirsac:
    description: "Staff (Modérateur) — voir la barre, la sacoche et l'équipement d'un joueur ; prendre un objet = Admin."
    usage: "/<command> <cible>"
    aliases: [invsee, voirinv]
    permission: reborn.staff.helper
  noir:
    description: "Staff (Modérateur) — écran noir forcé, avec durée et message ; « tous » = Admin."
    usage: "/<command> <cible|tous> [secondes|off] [message]"
    aliases: [blind, ecrannoir]
    permission: reborn.staff.helper
  seisme:
    description: "Staff (Admin) — séisme : écran qui tremble et grondement, sur un rayon ou tout le serveur."
    usage: "/<command> [rayon|tous] [force 1-10] [secondes] [message]"
    aliases: [earthquake]
    permission: reborn.staff.helper
  tenue:
    description: "Staff (Modérateur) — imposer une tenue (emplacement Tenue de la sacoche) ; « retirer » la rend."
    usage: "/<command> <cible> <id Nexo|main|retirer>"
    aliases: [forceclothes]
    permission: reborn.staff.helper
  emoteforcee:
    description: "Staff (Modérateur) — faire jouer une emote à un joueur ; « stop » l'arrête."
    usage: "/<command> <cible> <emote|stop>"
    aliases: [forceemote]
    permission: reborn.staff.helper
  persoreset:
    description: "Staff (Admin) — remettre un personnage à zéro (confirmation, sauvegarde avant)."
    usage: "/<command> <cible|#N°> [confirmer]"
    aliases: [resetcharacter]
    permission: reborn.staff.helper
  persosuppr:
    description: "Staff (Admin) — supprimer un personnage, slot libéré, N° réservé (confirmation, sauvegarde avant)."
    usage: "/<command> <cible|#N°> [confirmer]"
    aliases: [deletecharacter]
    permission: reborn.staff.helper
  modestaff:
    description: "Staff — mode staff : invisible aux joueurs, vol, aucune action de jeu, plaques au-dessus des têtes."
    usage: "/<command>"
    aliases: [staffmode, sm]
    permission: reborn.staff.helper
permissions:
  reborn.staff.helper:
    description: Poste de garde — Helper (alertes, TP, avertissements, chat staff).
    default: false
  reborn.staff.modo:
    description: Poste de garde — Modérateur (geler, observer, mute, ban jusqu'à 1 jour, KO / ATA).
    default: false
    children:
      reborn.staff.helper: true
  reborn.staff.admin:
    description: Poste de garde — Admin (bans longs et définitifs).
    default: false
    children:
      reborn.staff.modo: true
  reborn.staff.owner:
    description: Poste de garde — Owner (tout).
    default: op
    children:
      reborn.staff.admin: true
  shinobicore.grade.staff:
    description: Staff — donner ou retirer n'importe quel grade, sans les limites RP.
    default: op
  shinobicore.zonerp:
    description: Allows /zonerp (délimiter terrains d'entraînement et zones de repos).
    default: op
  shinobicore.hopital:
    description: Allows /hopital set|suppr|liste (lits de réveil par village).
    default: op
  shinobicore.ata:
    description: Allows /ata voir|lever|appliquer sur un autre joueur.
    default: op
  shinobicore.medic:
    description: Médic rang 1 — paume de soin jusqu'à 60 % des PV ; reçoit les appels à l'aide (/aide).
    default: false
  shinobicore.medic.expert:
    description: Médic rang 2 — paume de soin jusqu'à 100 %, plus rapide, lève toute ATA.
    default: op
    children:
      shinobicore.medic: true
  shinobicore.yeux.admin:
    description: "Staff : /yeux definir et /yeux donner (tests de la chirurgie des yeux)."
    default: op
  shinobicore.meteo:
    description: Allows /meteo (visual weather sent to the client mod).
    default: op
  shinobicore.map.tp:
    description: Staff — téléportation vers un lieu depuis la carte (« Y aller ») ou /carte tp.
    default: op
  shinobicore.map.admin:
    description: Staff — placer / supprimer les lieux de la carte (/carte set|del|reload).
    default: op
  shinobicore.stats.admin:
    description: Staff — voir / modifier les stats d'un personnage, points bonus, respec forcé.
    default: op
  shinobicore.fiche.staff:
    description: "Staff — fiche shinobi : éditer caractère, citation et dōjutsu, inscrire ou masquer des états de service (/fiche edit, /fiche service, /fiche json)."
    default: op
  shinobicore.use:
    description: Base permission to use ShinobiCore commands.
    default: true
  shinobicore.mobility.grapple:
    description: Allows using the Grappin de Ninja (grappling hook).
    default: true
  shinobicore.mobility.zipline:
    description: Allows using the Zipline de Ninja (deployable zipline).
    default: true
  shinobicore.character.admin:
    description: Admin access to create/edit/delete any character.
    default: op
  shinobicore.admin:
    description: Admin access for debug commands.
    default: op
  shinobicore.staff:
    description: Marks the holder as staff — appears in the "Staff connectés" tab block.
    default: op
  shinobicore.osculter:
    description: Allows /osculter (medical examination of a target's État).
    default: op
  shinobicore.dummy:
    description: Allows /dummy (create / edit / heal / delete training NPCs).
    default: op
  shinobicore.cinematic:
    description: Allows creating / editing / playing cinematics.
    default: op
  shinobicore.vanish:
    description: Allows using /vanish (staff invisibility).
    default: op
  shinobicore.emote:
    description: Allows /playemote and /stopemote (play RP emotes).
    default: true
  shinobicore.emote.others:
    description: Allows playing/stopping emotes on OTHER players (staff / MagicSpells).
    default: op
  shinobicore.creator.admin:
    description: Allows /creator reload (reload + push character-creator assets). Staff (Modelisateur/Developpeur).
    default: op
  shinobicore.emote.admin:
    description: Allows /playemote reload (reload emotes.yml).
    default: op
  shinobicore.ryo.admin:
    description: Allows /ryo give|take|set — grant/adjust the ryo shop currency. Staff.
    default: op
