# ------------------------------------------------------------
# ShinobiAbilities configuration
# All values below are live-reloadable with: /sa reload
# ------------------------------------------------------------

jutsu:
  # When true, a character can only BIND and CAST jutsu present in their
  # knownAbilities set (learned via the Étagère d'Apprentissage or
  # granted by /sa learn). Players with shinobiabilities.admin bypass.
  # Keep false during testing so every dummy jutsu is bindable.
  require-learned: false
  # No hard chakra gate: when true, a character may attempt ANY jutsu even if
  # they can't afford it — the shortfall becomes chakra debt and ShinobiCore's
  # exhaustion ladder collapses them (KO) if they overreach. This is the
  # "no rank gates — the economy balances" rule from the design bible. Set
  # false to refuse casts the character can't afford (the old hard gate).
  overdraw: true
  # Per-jutsu mastery gained per successful cast (0..100 scale). Consumed later
  # by efficiency (cost/cooldown) + enhanced-version unlocks. 0 disables it.
  mastery-per-cast: 1
  # Mastery efficiency: a fully-mastered (100) jutsu costs up to this fraction
  # less chakra, and cools down up to the cooldown fraction faster. So grinding
  # mastery is the legit path to wielding costly jutsu without collapsing.
  mastery-max-cost-reduction: 0.5
  mastery-max-cooldown-reduction: 0.3
  # Quick-cast: LEFT-click while holding a JutsuItem with the picker
  # CLOSED fires slot 1 of that item's bindings instantly — no
  # incantation, no delay, one feedback sound. The "panic button".
  quickcast:
    enabled: true
    # Soft debounce between two quick-cast attempts (milliseconds).
    debounce-ms: 250
  incantation:
    # Ticks between incantation steps. 5 = 0.25 s cadence.
    step-ticks: 5
  magicspells:
    # Console command generated by the `magicspell: <sort>` shorthand in
    # abilities.yml. %spell% = the declared spell, plus the standard
    # placeholders (%player%, %uuid%, %character%, %world%, %x/y/z%).
    # Adapt if your MagicSpells command alias differs.
    command-template: "cast forcecast %player% %spell%"

mobility:
  # Air-tokens gate airborne mobility abilities (Double Jump, Wall Jump,
  # Floor Shockwave). With max=1 a player gets at most ONE airborne
  # manoeuvre per ground touch. Tokens refill ONLY after the player has
  # been continuously grounded for refill-grounded-ms milliseconds —
  # grazing the floor for a single tick does NOT refill.
  air-tokens:
    max: 1
    refill-grounded-ms: 100

  # Fluidity rework — global feel knobs (see Mobility_Fluidity_Rework).
  feel:
    # intentDir: 1.0 = old look-snap; lower carries more momentum on turns.
    dir-look-weight: 0.7

  naruto-run:
    enabled: true
    # Naruto-Run STARTING speed multiplier (applied the instant you toggle on).
    speed-multiplier: 1.6
    # Top speed multiplier reached at the end of the accel ramp.
    max-speed-multiplier: 10
    # Accelerate from speed-multiplier up to max-speed-multiplier over this many
    # ms of MOVING time (600000 = 10 minutes). The ramp only advances while the
    # player is actually moving.
    accel-ramp-ms: 600000
    # If the player stops moving for this long, the ramp resets to base speed.
    # (Stopping for less than this just pauses the ramp.)
    stop-reset-ms: 5000
    # Small forward kick when toggled on from a standstill (0 = off).
    launch-impulse: 0.25
    chakra-cost-per-second: 3.0
    min-chakra-to-start: 5.0
    # Sneak-TAP toggles the run: press+release faster than this.
    toggle-tap-max-ms: 300
    particles: true
    wind-sound: "ITEM_ELYTRA_FLYING"
    wind-volume: 0.35
    wind-pitch: 1.2
    wind-loop-ticks: 20
    # Boost for other mobility (dash / double-jump / wall-jump) while running.
    # Ramps from 1x up to these maxes over boost.ramp-ms of MOVING time
    # (2.5x after 2 minutes by default) — separate from, and faster than, the
    # speed ramp. (max-vertical 2.5 launches quite high; lower it if needed.)
    boost:
      max-horizontal: 2.5
      max-vertical: 2.5
      ramp-ms: 120000

  # Air-control (reworked §4.1): momentum-aware steering that is ALWAYS
  # available while airborne; the leap window only RAISES the cap. Never brakes
  # speed above the cap (a dash carries + bleeds naturally); never touches Y.
  air-control:
    # Master switch — OFF: NO air-control steering at all (pure vanilla air
    # physics + the double-jump curve). This avoids the post-leap slowdown.
    # Set true to bring back momentum-aware steering.
    enabled: false
    # (Only used when enabled) steer always while airborne vs only post-leap.
    always-on: false
    accel-per-tick: 0.06     # how fast horizontal turns toward intent
    min-speed: 0.08          # below this horizontal speed, no steer (jump in place)
    base-cap-h: 0.55         # steer cap in a normal fall
    leap-cap-h: 1.30         # raised cap during the post-leap window
    run-cap-bonus: 1.15      # multiplies the cap while Course Shinobi is active
    leap-window-ms: 1500     # window now only RAISES the cap  # was 2000

  double-jump:
    enabled: true
    chakra-cost: 10.0
    air-token-cost: 1
    # Pitch-blended leap anchors (raw velocities).
    horizontal-forward: 1.8
    vertical-forward: 0.75
    horizontal-up: 0.55
    vertical-up: 2.0
    horizontal-down: 1.8
    vertical-down: 0.45
    # Player must re-touch ground before another DJ, even with tokens.
    require-ground-touch-between: true
    # Min ms since last DJ before the lockout may clear on ground touch.
    lockout-min-air-ms: 400
    cooldown-ms: 500
    # Fluidity: leaps blend with your momentum instead of replacing it.
    preserve-h: 0.5
    soft-cap-h: 1.4
    # Velocity curve: pop up, then accelerate the forward push over this many
    # ticks (ease-in from curve-start-frac to full). While Naruto-Running the
    # cap scales with run speed so a fast leap keeps its momentum.
    curve-ticks: 6
    # Standing-jump start speed as a fraction of the leap (a MOVING leap never
    # drops below your current speed regardless of this).
    curve-start-frac: 0.7

  wall-jump:
    enabled: true
    chakra-cost: 8.0
    # Same pitch-blend, horizontal always pushed AWAY from the wall face.
    horizontal-forward: 1.8
    vertical-forward: 0.75
    horizontal-up: 0.55
    vertical-up: 2.0
    horizontal-down: 1.8
    vertical-down: 0.45
    # ------------------------------------------------------------------
    # INDEPENDENT BUDGET: wall jumps do NOT consume the DJ air token and
    # never delay its refill — wall-jump then double-jump (or the
    # reverse) chains freely in the same airtime. The WJ budget is this
    # per-airtime counter instead, reset by the same continuous ground
    # dwell as the air tokens. 0 = unlimited (watch for corridor
    # wall↔wall climbing if you open it up).
    # ------------------------------------------------------------------
    max-per-airtime: 3
    # Deliberately false — true enables infinite wall↔double-jump flight.
    refill-tokens-on-use: false
    clears-double-jump-lockout: false
    cooldown-ms: 350
    preserve-h: 0.45
    soft-cap-h: 1.4

  # FloorShockwave — sneak in the air for charge-seconds to slam down
  # toward where you look. On impact: AoE damage + knockback + stun.
  floor-shockwave:
    enabled: true
    chakra-cost: 25.0
    air-token-cost: 1
    charge-seconds: 1.2      # was 3.0 — responsive commit to the slam
    horizontal-forward: 3.0
    down-forward: 3.5
    horizontal-up: 0.8
    down-up: 4.2
    horizontal-down: 0.4
    down-down: 4.5
    radius-blocks: 6.0
    damage-hp: 5.0
    knockback-blocks: 3.0
    victim-stun-seconds: 0.5
    user-stun-seconds: 0.5
    cooldown-ms: 10000

  # ShinobiDash — hold SNEAK on the ground, release to dash.
  shinobi-dash:
    enabled: true
    # Fluidity §4.5: double-tap sneak fires the dash (snappy + crouch-safe).
    input: DOUBLE_TAP        # DOUBLE_TAP (default); SHORT_HOLD not wired
    double-tap-ms: 250       # max gap between the two sneak taps
    chakra-cost: 15.0        # was 20.0 — chakra is the limiter now
    min-hold-seconds: 3.0    # ignored with DOUBLE_TAP input
    horizontal-forward: 3.0
    vertical-forward: 0.4
    horizontal-up: 0.8
    vertical-up: 3.0
    horizontal-down: 3.0
    vertical-down: 0.2
    bonus-per-extra-second: 0.15
    max-multiplier: 1.5
    cooldown-ms: 4000        # was 30000 — chakra is now the limiter
    # Fluidity: dash ADDS to momentum (keeps some rise/fall).
    preserve-h: 0.5
    soft-cap-h: 1.8

  # Climb — airborne wall-cling. Sneak in the air next to a wall to
  # freeze in place; release sneak for an upward leap. Paced by a
  # charge economy refilled by cumulative ground contact.
  climb:
    enabled: true
    max-charges: 2
    recovery-seconds: 5.0
    # Fluidity §4.7: cling SCALES the wall instead of a dead freeze.
    scale-speed: 0.30        # upward drift while gripping (b/tick)
    scale-ticks: 14          # ticks of scaling before it slides
    slide-speed: 0.08        # gentle downward slide after
    leap-velocity: 0.75
    # Fluidity: kick-off blends away-from-wall + intent + travel.
    leap-push-h: 0.5
    leap-preserve-h: 0.4
    leap-soft-cap-h: 1.2

  # Trail — staff-built chains of invisible anchors players can ride.
  # Stand near a trail's FIRST anchor and press F (empty hand or any
  # non-JutsuItem) to ride; F again cancels mid-ride. The ride LEAPS from
  # anchor to anchor: a short dwell on each, then a smooth parabolic jump.
  trail:
    enabled: true
    activation-radius: 3.0
    # Apex of each leap, in blocks above the straight line between anchors.
    leap-height: 4.5
    # Horizontal blocks per tick during a leap (sets the flight duration).
    leap-speed: 0.7
    # Ticks to dwell on each anchor before springing to the next (10 = 0.5s).
    pause-ticks: 10
    # Safety ceiling on a single ride (ticks).
    max-ride-ticks: 600

  # Training-ground parkours — reaction-timed leaps that UNLOCK mobility
  # abilities. Each anchor plays a reaction mini-game whose key (sneak/space/
  # left-click), success zone, loop count and bar speed are set per-anchor in
  # the editor (/trainingground create). A good hit leaps to the next anchor;
  # a miss or time-out leaps too weakly and the runner falls off.
  training:
    # Horizontal blocks per tick during a leap (sets the flight duration).
    leap-speed: 0.7
    # Apex of each leap, in blocks above the straight line between anchors.
    leap-height: 4.5
    # A failed reaction drives only this fraction of the leap before dropping.
    weak-fraction: 0.55
    # Safety ceiling on a single run (ticks). 2400 = 2 min.
    max-run-ticks: 2400

techniques:
  # PUSHUP minigame — sneak-rep counts per jutsu rank.
  pushup-reps:
    E: 5
    D: 8
    C: 12
    B: 16
    A: 20
    HIDEN: 25

# ------------------------------------------------------------ fuinjutsu
# Sceau de Contention — sealing channel against transformed jinchūriki
# (requires the ShinobiTail plugin; sneak + right-click the target).
fuinjutsu:
  seal:
    enabled: true
    # If set, the caster's CHARACTER must know this ability id
    # (knownAbilities, granted via /sa learn or the learning shelves).
    # Empty = the shinobiabilities.fuinjutsu permission is enough.
    ability-id: ""
    # Free to cast; this is the delay between attempts.
    cooldown-seconds: 25
    # Drain cadence: every tick-seconds, the target loses rage-per-tick
    # percent of rage and the sealer pays chakra-percent-per-tick
    # percent of MAX chakra. Out of chakra = the link snaps.
    tick-seconds: 5
    rage-per-tick: 5.0
    chakra-percent-per-tick: 5.0
    # The link snaps beyond this distance (blocks)…
    max-distance: 10.0
    # …and when the sealer takes any damage.
    interrupt-on-damage: true
