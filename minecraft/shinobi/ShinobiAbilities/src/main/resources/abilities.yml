# ------------------------------------------------------------
# ShinobiAbilities — abilities.yml
# 11 techniques façonnées à la main + 204 entrées d'essai
# (34 catégories feuilles × 6 rangs E/D/C/B/A/HIDEN), toutes à
# 50 chakra / 5 s de recharge / LEFT_CLICK / minigame NONE — de
# quoi lier et tester chaque JutsuItem immédiatement.
# Rechargeable à chaud : /sa reload
#
# ════════════════ CRÉER UN NOUVEAU JUTSU ════════════════
# - id: mon_jutsu                  # unique, minuscules
#   name: "Mon Jutsu"
#   category: "ninjutsu/katon"     # route le canal (Rouleau, Katana…)
#   rank: C                        # E, D, C, B, A, HIDEN
#   execution: JUTSU               # JUTSU, PHYSICAL, PASSIVE, TOOL
#   minigame: MUDRA                # MUDRA, PUSHUP, SUIVI, NONE
#   difficulty: MEDIUM             # EASY, MEDIUM, HARD
#   mudras: [tigre, serpent]       # incantation ninjutsu (signes)
#   # OU, pour les arts sans signes (taijutsu, kenjutsu…) :
#   # steps: ["Appui", "Pivot", "Frappe"]   # alias: mouvements/gestures
#   description: "…"
#   jutsu:
#     item-type: ROULEAU           # optionnel — déduit de la catégorie
#     icon: FIRE_CHARGE
#     method: LEFT_CLICK           # RIGHT_CLICK, HOLD_SNEAK, CLICK_SEQUENCE
#     chakra-cost: 25
#     cooldown-millis: 6000
#     # ── L'EFFET : UNE des trois formes (cumulables) ──
#     effect: katon_gokakyu        # 1) effet interne (registre Java)
#     # type: MAGICSPELL           # (lisibilité, optionnel)
#     # magicspell: gokakyu        # 2) sort MagicSpells — exécute
#     #                            #    "cast forcecast %player% gokakyu"
#     #                            #    (modèle: config jutsu.magicspells)
#     # commands:                  # 3) commandes brutes, contrôle total
#     #   - "cast forcecast %player% gokakyu"
#     # run-as: CONSOLE            # ou PLAYER
#     # Placeholders : %player% %uuid% %character% %world% %x% %y% %z%
#
# Exemple MagicSpells complet (décommente + adapte le nom du sort) :
#  - id: ms_katon_demo
#    name: "Katon — Démo MagicSpells"
#    category: "ninjutsu/katon"
#    rank: C
#    execution: JUTSU
#    minigame: MUDRA
#    difficulty: MEDIUM
#    mudras: [serpent, belier, tigre]
#    description: "Le sort 'fireball' de MagicSpells, lancé par le personnage."
#    jutsu:
#      icon: FIRE_CHARGE
#      method: LEFT_CLICK
#      chakra-cost: 20
#      cooldown-millis: 5000
#      type: MAGICSPELL
#      magicspell: fireball
#
# Exemple taijutsu avec mouvements (pas de mudras) :
#  - id: ms_taijutsu_demo
#    name: "Goken — Enchaînement Démo"
#    category: "taijutsu/goken"
#    rank: D
#    execution: JUTSU
#    minigame: PUSHUP
#    difficulty: MEDIUM
#    steps: ["Garde", "Appui", "Pivot", "Frappe"]
#    description: "Un enchaînement au corps-à-corps via MagicSpells."
#    jutsu:
#      icon: IRON_INGOT
#      method: CLICK_SEQUENCE
#      chakra-cost: 12
#      cooldown-millis: 4000
#      magicspell: punch_combo
# ═════════════════════════════════════════════════════════
