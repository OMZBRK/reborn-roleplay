// Reborn Integrity — mod Fabric client-side (attestation play-token).
//
// Config Groovy alignee sur FabricMC/fabric-example-mod branche 26.1.2 :
// depuis la 26.x le client Mojang est livre DEOBFUSQUE (noms officiels dans
// le jar), Yarn est discontinue, et Loom 1.17+ n'exige AUCUNE ligne
// `mappings(...)` (il detecte le jar deobfusque). Java 25, Gradle 9.6.
//
// Build : ./gradlew build  → build/libs/reborn-integrity-<ver>.jar

plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

loom {
    mods {
        "reborn-integrity" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // 26.x deobf : Loom (net.fabricmc.fabric-loom snapshot) supprime
    // `modImplementation` ; les modules fabric-api passent par le helper
    // `fabricApi.module(...)` (remap vers les noms officiels). Pas de `include`
    // (fabric-api est fourni par le modpack au runtime, on ne le bundle pas).
    // fabric-networking-api-v1 = ClientPlayConnectionEvents / ClientPlayNetworking
    // / PayloadTypeRegistry (6.x : serverboundPlay() ex-playC2S()).
    implementation fabricApi.module("fabric-networking-api-v1", project.fabric_version)
}

processResources {
    def props = [
        version          : project.version,
        minecraft_version: project.minecraft_version,
        loader_version   : project.loader_version,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
